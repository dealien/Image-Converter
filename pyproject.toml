[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "image-converter"
version = "0.1.0"
description = "A command-line image processing tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow==11.3.0",
    "rembg==2.0.67",
    "scikit-image==0.25.2",
    "numpy==2.2.6",
    "questionary==2.1.1",
    "prompt_toolkit==3.0.52",
    "onnxruntime==1.22.1",
    "rich==13.9.4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.5",
    "mkdocstrings==1.0.3",
    "mkdocstrings-python==2.0.3",
    "griffe==1.15.0",
]

[project.scripts]
image-converter = "image_converter.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_testing.py"]
addopts = "--cov=. --cov-report=term-missing --cov-report=html --cov-report=xml"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "setup_env.py",
    "run_mocked_tests.py",
    "verify_ui.py",
    "*/__pycache__/*",
    ".venv/*",
    "mockups/*",
    "site/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "pass",
    "break",
]
show_missing = true
